<!DOCTYPE html>
<html>
<head><title>Shopping Cart</title></head>
<body>
    <h2>Select Items to Add to Cart</h2>
    <form action="addToCart" method="post">
        <input type="checkbox" name="item" value="Pen"> Pen<br>
        <input type="checkbox" name="item" value="Notebook"> Notebook<br>
        <input type="checkbox" name="item" value="Pencil"> Pencil<br>
        <input type="checkbox" name="item" value="Bag"> Bag<br><br>
        <input type="submit" value="Add to Cart">
    </form>

    <br>
    <form action="viewCart" method="get">
        <input type="submit" value="View Cart">
    </form>
</body>
</html>
